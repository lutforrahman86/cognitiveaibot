name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognitiveaibot_web/backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cognitiveaibot_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Tests refuse any database whose name doesn't end in _test.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cognitiveaibot_test
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cognitiveaibot_web/backend/package-lock.json
      - run: npm ci
      # No AI provider, Stripe or RevenueCat is ever called: tests use local stand-ins.
      - run: npm test

  web:
    name: Web build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognitiveaibot_web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: cognitiveaibot_web/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Docker images build and start
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognitiveaibot_web
    env:
      ENV_FILE: .env.ci
      POSTGRES_PASSWORD: ci-only-password
      WEB_PORT: '8080'
    steps:
      - uses: actions/checkout@v4
      - name: Build the images and start the stack
        run: |
          { cat backend/.env.example; echo 'JWT_SECRET=ci-only-secret'; } > .env.ci
          docker compose up -d --build --wait --wait-timeout 180
      - name: The web app serves the site and reaches the API through nginx
        run: |
          curl -fsS http://localhost:8080/ | grep -q '<div id="app">'
          curl -fsS http://localhost:8080/api/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/api/plans | grep -q '"plans"'
      - name: Backups work against the running database
        run: |
          scripts/backup-db.sh --compose
          ls backups/*.dump
      - if: failure()
        run: docker compose logs --no-color | tail -200

  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cognitiveaibot_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to the version the app is developed with: a newer Flutter
          # adds lints and deprecations, so upgrading should be its own change.
          flutter-version: 3.47.2
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
